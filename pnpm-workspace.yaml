packages:
  - packages/*
allowBuilds:
  "@biomejs/biome": true
  "@deepseek-ai/dsh-subprocess-local": true
  "@google/genai": false
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: false
# DSH 0.2.2-rc.4 is newer than pnpm's default release-age window.
minimumReleaseAgeExclude:
  - "@deepseek-ai/*"
  - dsh-plugin-chatgpt-siwc@0.9.4

# The retired Exa/Perplexity adapters are used as providers, not loaded as old hosts.
overrides:
  "@deepseek-ai/dsh-launch-environment": "0.2.2-rc.4"
  "@deepseek-ai/dsh-web": "0.2.2-rc.4"
