packages:
  - packages/*
allowBuilds:
  "@biomejs/biome": true
  "@deepseek-ai/dsh-subprocess-local": true
  "@google/genai": false
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: false
# DSH 0.2.1-rc.3 is newer than pnpm's default release-age window.
minimumReleaseAgeExclude:
  - "@deepseek-ai/*"
  - dsh-plugin-chatgpt-siwc@0.9.4
