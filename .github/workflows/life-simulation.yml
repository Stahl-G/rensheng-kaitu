name: Life simulation prototype
on:
  pull_request:
    paths:
      - "prototypes/life-simulation/**"
      - ".github/workflows/life-simulation.yml"
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test --prefix prototypes/life-simulation
