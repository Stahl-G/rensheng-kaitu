<h1>开图品牌色板</h1>
<p>品牌朱砂贯穿链接、开图与地图；其余板块采用低饱和自然色。今天保留墨色。旧色为上一版品牌深青。</p>
<button id="theme">示例卡片：切换深色</button><div id="cards" class="cards"></div>
<p>对比度按 WCAG 相对亮度实时计算。文字按前景 / 背景角色配对，装饰色以示例正文展示，低于 4.5:1 标红。
板块主色作为图形时另列其与页面底色的对比度，低于 3:1 标红。修改新色值后，对比度与示例卡片即时更新。</p>

function luminance(hex) {
  let value = hex.slice(1)
  if (value.length === 3) value = value.split('').map(x => x + x).join('')
  const linear = [0, 2, 4].map(i => parseInt(value.slice(i, i + 2), 16) / 255)
    .map(x => x <= 0.04045 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4)
  return linear[0] * 0.2126 + linear[1] * 0.7152 + linear[2] * 0.0722
}
function contrast(a, b) {
  const x = luminance(a)
  const y = luminance(b)
  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05)
}
function pair(key, values) {
  const legacy = key.startsWith('kt-')
  const prefix = legacy ? 'kt-' : ''
  const name = legacy ? key.slice(3) : key
  const text = values[legacy ? 'kt-text' : 'ink']
  const surface = values[legacy ? 'kt-card' : 'surface']
  const accents = [...groups, 'projects', 'map', 'feed', 'today']
  if (accents.includes(name)) {
    return [values[prefix + name + '-ink'] || text, values[prefix + name + '-tint'] || surface,
      '板块文字 / 浅底', contrast(values[key], surface)]
  }
  if (name.endsWith('-ink')) {
    return [values[key], values[key.replace(/-ink$/, '-tint')] || surface, '文字 / 板块底']
  }
  if (name.endsWith('-tint')) {
    return [values[key.replace(/-tint$/, '-ink')] || text, values[key], '文字 / 板块底']
  }
  if (name.startsWith('on-')) return [values[key], values[prefix + name.slice(3)], '按钮文字 / 底']
  if (name === 'strong') return [values['on-strong'], values[key], '按钮文字 / 底']
  if (name === 'primary') return [values[prefix + 'on-primary'], values[key], '按钮文字 / 底']
  if (['ink', 'ink2', 'muted', 'link', 'text', 'secondary'].includes(name)) {
    return [values[key], surface, '文字 / 卡片']
  }
  if (['accent', 'target', 'estimate'].includes(name)) {
    return [values[prefix + 'link'], surface, '链接 / 卡片', contrast(values[key], surface)]
  }
  if (name === 'faint') return [null, null, '装饰边框，文字使用 --kt-muted']
  if (key.startsWith('brand-')) {
    const fold = key === 'brand-route' ? values['brand-fold0'] : values[key]
    const route = key === 'brand-fold2' ? '#7c2a1e' : values['brand-route']
    return [null, null, '标志路线 / 折面', contrast(fold, route)]
  }
  if (name === 'scrim') return [null, null, '遮罩，无文字']
  return [text, values[key], '示例正文 / 此色块']
}
function score(key, values) {
  const [fg, bg, label, graphic] = pair(key, values)
  const ratio = fg && bg ? contrast(fg, bg) : null
  const result = ratio === null ? '—' :
    `<span class="${ratio < 4.5 ? 'bad' : 'ok'}">${ratio.toFixed(2)}:1</span>`
  return result + `<small>${label}${fg ? ': ' + fg + ' / ' + bg : ''}</small>` +
    (graphic ? `<small class="${graphic < 3 ? 'bad' : 'ok'}">图形 ${graphic.toFixed(2)}:1</small>` : '')
}
function cell(value, key, theme) {
  if (!value) return '<td>新增</td>'
  const editable = theme !== undefined && value.startsWith('#')
  const swatch = editable ?
    `<input type="color" aria-label="${key} ${theme ? '深色' : '浅色'}" data-key="${key}" data-theme="${theme}"` +
    ` value="${value.length === 4 ? '#' + value.slice(1).split('').map(x => x + x).join('') : value}">` :
    `<i class="swatch" style="background:${value}"></i>`
  return `<td>${swatch}${value.toUpperCase()}</td>`
}
function render() {
  const keys = [...new Set([...Object.keys(data.old[0]), ...Object.keys(data.new[0])])]
  document.querySelector('#rows').innerHTML = keys.map(key => `<tr><td>--${key}</td>` +
    cell(data.old[0][key], key) + cell(data.new[0][key], key, 0) +
    cell(data.old[1][key] || data.old[0][key], key) + cell(data.new[1][key] || data.new[0][key], key, 1) +
    `<td>${score(key, data.new[0])}</td>` +
    `<td>${score(key, {...data.new[0], ...data.new[1]})}</td></tr>`).join('')
  const values = dark ? {...data.new[0], ...data.new[1]} : data.new[0]
  document.querySelector('#cards').innerHTML = groups.map((group, i) =>
    `<article class="card" style="background:${values[group + '-tint']};color:${values[group + '-ink']}">` +
    `<h2><i style="background:${values[group]}"></i>${names[i]}</h2><p>看见现状，探索下一步。</p>` +
    `<a style="color:${values.link}" href="#rows">查看配色</a></article>`).join('')
  document.querySelector('#theme').textContent = `示例卡片：切换${dark ? '浅' : '深'}色`
}
document.querySelector('#theme').onclick = () => {
  dark = !dark
  render()
}
document.querySelector('#rows').addEventListener('change', event => {
  const input = event.target
  if (input instanceof HTMLInputElement && input.dataset.key) {
    data.new[Number(input.dataset.theme)][input.dataset.key] = input.value
    render()
  }
})
