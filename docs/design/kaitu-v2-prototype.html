<title>开图新版界面</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：顶栏三入口居中，内容单列 1040px；摘要卡片自动成网格，窄屏全部单列 */
:root {
  --bg: #FCFCFB; --surface: #FFFFFF; --sunken: #F5F5F3; --control: #F0EFEC; --line: #ECEBE7;
  --ink: #1F1E1D; --ink2: #4D4C48; --muted: #6B6A66; --link: #2F5FC4;
  --primary: #2F5FC4; --on-primary: #FFFFFF; --strong: #1F1E1D; --on-strong: #FFFFFF;
  --ask: #F2F5FD; --ask-line: #DCE4F8; --scrim: rgba(31,30,29,0.42);
  --health: #2E8B57; --health-tint: #E8F3EC; --health-ink: #1F6B43;
  --doing: #6B5BD6; --doing-tint: #EFEDFB; --doing-ink: #4B3FB0;
  --explore: #3D6FE0; --explore-tint: #ECF1FC; --explore-ink: #2A4FA8;
  --news: #C47A12; --news-tint: #FBEFE0; --news-ink: #8A520A;
  --finance: #1F8A8A; --finance-tint: #E3F2F2; --finance-ink: #176868;
  --me: #C2507A; --empty: #F0EFEC; --map-land: #EEF1EC; --map-grid: #DDE2DA; --map-sea: #F4F6F7; --map-dot: #D3DAD4;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171716; --surface: #201F1E; --sunken: #1B1B1A; --control: #2A2927; --line: #2F2E2C;
  --ink: #ECEBE8; --ink2: #C9C7C2; --muted: #A09E98; --link: #8FB0F5;
  --primary: #4C7BE6; --on-primary: #FFFFFF; --strong: #ECEBE8; --on-strong: #171716;
  --ask: #1E2638; --ask-line: #2C3A5C; --scrim: rgba(0,0,0,0.6);
  --health-tint: #1C3226; --health-ink: #8FD3AC; --doing-tint: #2A2547; --doing-ink: #B9AFF5;
  --explore-tint: #1E2A45; --explore-ink: #A9C1F7; --news-tint: #3A2A12; --news-ink: #EBC27F;
  --finance-tint: #173333; --finance-ink: #8ED1D1; --empty: #2A2927; --map-land: #1F2620; --map-grid: #2D352E; --map-sea: #1A1C1D; --map-dot: #343D36;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #171716; --surface: #201F1E; --sunken: #1B1B1A; --control: #2A2927; --line: #2F2E2C;
  --ink: #ECEBE8; --ink2: #C9C7C2; --muted: #A09E98; --link: #8FB0F5;
  --primary: #4C7BE6; --on-primary: #FFFFFF; --strong: #ECEBE8; --on-strong: #171716;
  --ask: #1E2638; --ask-line: #2C3A5C; --scrim: rgba(0,0,0,0.6);
  --health-tint: #1C3226; --health-ink: #8FD3AC; --doing-tint: #2A2547; --doing-ink: #B9AFF5;
  --explore-tint: #1E2A45; --explore-ink: #A9C1F7; --news-tint: #3A2A12; --news-ink: #EBC27F;
  --finance-tint: #173333; --finance-ink: #8ED1D1; --empty: #2A2927; --map-land: #1F2620; --map-grid: #2D352E; --map-sea: #1A1C1D; --map-dot: #343D36;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
a { color: var(--link); text-decoration: none; font-weight: 500 }
a:hover { text-decoration: underline dotted; text-underline-offset: 3px }
button, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--explore); outline-offset: 2px }
h1, h2, h3, p { margin: 0 }
h1, h2, h3 { text-wrap: balance }
.num { font-variant-numeric: tabular-nums }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }

/* 原型演示条：和产品界面区分开 */
.demo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--sunken); border-bottom: 1px dashed var(--line); font-size: 13px; color: var(--muted) }
.demo b { font-weight: 600; color: var(--ink2) }
.demo button { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px dashed var(--muted); background: transparent; font-size: 13px; color: var(--ink2) }
.demo button[aria-pressed="true"] { border-style: solid; border-color: var(--ink); color: var(--ink); background: var(--surface) }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid var(--line) }
.brand { flex: 1 1 120px; display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600 }
.tabs { flex: 0 1 auto; display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--control) }
.tabs button { height: 40px; padding: 0 22px; border: 0; border-radius: 9px; background: transparent; color: var(--ink2); font-size: 15px; font-weight: 500 }
.tabs button[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(31,30,29,0.12) }
.tools { flex: 1 1 120px; display: flex; align-items: center; justify-content: flex-end; gap: 10px }
.sync { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted) }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block }
.btn { height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border-radius: 10px; border: 0; font-size: 15px; font-weight: 500; white-space: nowrap }
.btn-primary { background: var(--primary); color: var(--on-primary) }
.btn-strong { background: var(--strong); color: var(--on-strong) }
.btn-quiet { background: var(--control); color: var(--ink); font-weight: 400 }
.btn-big { height: 44px; padding: 0 20px }
.avatar { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--me); color: #FFFFFF; font-weight: 600 }

main { max-width: 1040px; margin: 0 auto; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 32px }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px }
.head h1 { font-size: 28px; line-height: 36px; font-weight: 600 }
.sub { font-size: 14px; color: var(--muted) }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em }
.sec { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: 0 0 0 1px var(--line) }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 6px; font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap }

.capture { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px; border-radius: 14px; background: var(--surface); box-shadow: 0 1px 3px rgba(31,30,29,0.08), 0 0 0 1px var(--line) }
.capture input { flex: 1 1 260px; min-width: 0; height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; font-size: 16px }
.capture input::placeholder { color: var(--muted) }
.saved { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--ink2) }

.focus { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding: 24px; border-radius: 18px; box-shadow: 0 1px 3px rgba(31,30,29,0.08), 0 0 0 1px var(--line) }
.focus-body { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 8px }
.focus-title { font-size: 22px; line-height: 30px; font-weight: 600 }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-height: 52px; padding: 6px 16px }
.row-title { flex: 1 1 240px; min-width: 0; font-size: 16px }
.check { width: 24px; height: 24px; flex: none; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 50%; border: 1.5px solid var(--muted); background: transparent; color: transparent }
.check[aria-pressed="true"] { border-color: var(--health); background: var(--health); color: #FFFFFF }
.row.is-done .row-title { text-decoration: line-through; color: var(--muted) }
.when { width: 64px; text-align: right; font-size: 13px; color: var(--muted) }

.ask { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 18px; border-radius: 14px; background: var(--ask); box-shadow: 0 0 0 1px var(--ask-line) }
.ask p { flex: 1 1 300px; min-width: 0 }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px }
.sum { display: flex; flex-direction: column; gap: 14px; padding: 18px; color: var(--ink); font-weight: 400 }
.sum:hover { text-decoration: none; box-shadow: 0 0 0 1px var(--muted) }
.sum-h { display: flex; align-items: center; gap: 8px; font-weight: 600 }
.sum-h span:last-child { margin-left: auto; font-weight: 400; font-size: 13px; color: var(--muted) }
.big { font-size: 26px; line-height: 32px; font-weight: 600 }
.small { font-size: 13px; color: var(--muted) }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.stack { display: flex; flex-direction: column; gap: 2px }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px }
.week span { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted) }
.week i { display: block; width: 100%; height: 18px; border-radius: 5px; background: var(--empty) }
.bar { height: 8px; border-radius: 4px; background: var(--control); overflow: hidden; display: flex }
.bar i { display: block; height: 100% }
.fin { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; overflow: hidden }
.fin-cell { display: flex; flex-direction: column; gap: 2px; padding: 18px; border-right: 1px solid var(--line); min-width: 0 }
.fin-cell:nth-child(4) { border-right: 0 }
.fin-wide { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border-top: 1px solid var(--line) }
.fin-pending { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 12px }
@media (max-width: 760px) {
  .fin { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .fin-cell { border-right: 0; border-bottom: 1px solid var(--line) }
  .fin-cell:nth-child(odd) { border-right: 1px solid var(--line) }
}
.feed-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 4px; border-top: 1px solid var(--line) }
.feed-row p { flex: 1 1 300px; min-width: 0 }
.ini { width: 28px; height: 28px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #FFFFFF; font-size: 12px; font-weight: 600 }

/* 第一次打开 */
.welcome { display: flex; flex-direction: column; gap: 10px; padding: 32px 28px; border-radius: 20px; background: var(--surface); box-shadow: 0 0 0 1px var(--line) }
.welcome h1 { font-size: 30px; line-height: 40px; font-weight: 600 }
.welcome p { max-width: 36em; color: var(--ink2); font-size: 16px }
.starts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px }
.start { display: flex; flex-direction: column; gap: 10px; padding: 20px; text-align: left; border: 0 }
.start h3 { font-size: 17px; font-weight: 600 }
.start p { color: var(--ink2); font-size: 14px }
.start .tag { align-self: flex-start }
.ob { display: flex; flex-direction: column; gap: 18px; padding: 28px; max-width: 860px; width: 100%; margin: 0 auto }
.ob-h { font-size: 26px; line-height: 34px; font-weight: 600; text-wrap: balance }
.ob-lead { color: var(--ink2); font-size: 15px; max-width: 40em; margin-top: -8px }
.ob-steps { display: flex; flex-wrap: wrap; gap: 6px 18px; list-style: none; padding: 0; margin: 0; font-size: 13px; color: var(--muted) }
.ob-steps li { display: flex; align-items: center; gap: 6px }
.ob-steps .num { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--control); font-size: 12px }
.ob-steps .is-now { color: var(--ink); font-weight: 600 }
.ob-steps .is-now .num { background: var(--primary); color: #FFFFFF }
.ob-steps .is-done .num { background: var(--health-tint); color: var(--health-ink) }
.ob-ais { display: flex; flex-wrap: wrap; gap: 6px }
.ob-ais button { height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--line); background: transparent; color: var(--ink2); font-size: 14px }
.ob-ais button[aria-checked="true"] { background: var(--strong); border-color: var(--strong); color: var(--on-strong) }
.ob-step { display: flex; gap: 12px; align-items: flex-start }
.ob-n { flex: none; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--control); font-size: 13px; font-weight: 600 }
.ob-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px }
.ob-prompt { position: relative; border-radius: 12px; background: var(--control) }
.ob-prompt pre { margin: 0; padding: 14px 16px; padding-right: 84px; white-space: pre-wrap; font: 13px/1.7 inherit; color: var(--ink) }
.ob-prompt .btn { position: absolute; top: 8px; right: 8px; height: 32px; background: var(--surface) }
.ob textarea { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; resize: vertical }
.ob-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px }
.ob-foot-r { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-left: auto }
.link-btn { border: 0; background: none; padding: 0; color: var(--primary); font: inherit; font-size: 14px; cursor: pointer }
.ob-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px }
.ob-group { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.ob-item { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 14px }
.ob-item input { margin-top: 3px; accent-color: var(--primary) }
.ob-goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px }
.ob-goal { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-align: left }
.ob-goal b { font-weight: 600; font-size: 15px }
.ob-goal span { font-size: 13px; color: var(--ink2) }
.ob-goal[aria-pressed="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); background: var(--control) }
.ob-srcs { display: flex; flex-direction: column; padding: 4px 18px }
.ob-src { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 0; border-top: 1px solid var(--line) }
.ob-src:first-child { border-top: 0 }
.ob-src-t { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 2px }
.ob-how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 8px 0 }
.ob-how div { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 14px; background: var(--control) }
.ob-how span { font-size: 13px; color: var(--ink2) }
.ob-check { display: flex; flex-direction: column; gap: 10px; padding: 18px 20px }
.ob-chk { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line) }
.ob-chk .stack { flex: 1; min-width: 0 }
.ob-chk.is-done b { color: var(--muted); font-weight: 500 }
.ob-tick { flex: none; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); font-size: 13px; color: var(--health-ink) }
.ob-chk.is-done .ob-tick { background: var(--health-tint); box-shadow: none }
@media (max-width: 760px) {
  .ob { padding: 20px 16px }
  .ob-groups, .ob-how { grid-template-columns: 1fr }
}

/* 开图 */
.subtabs { display: flex; flex-wrap: wrap; gap: 6px }
.subtabs button { height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid var(--line); background: transparent; color: var(--ink2); font-size: 14px }
.subtabs button[aria-pressed="true"] { background: var(--strong); border-color: var(--strong); color: var(--on-strong) }
.dir { display: flex; flex-direction: column; gap: 14px; padding: 20px }
.dir h3 { font-size: 19px; line-height: 27px; font-weight: 600 }
.dir dl { margin: 0; display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: 6px 12px; font-size: 14px }
.dir dt { color: var(--muted) }
.dir dd { margin: 0; color: var(--ink) }
.attempt { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: var(--sunken); font-size: 14px }
.evidence { display: flex; flex-wrap: wrap; gap: 6px }
.dir-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px }
.dir.is-paused { background: var(--sunken); box-shadow: 0 0 0 1px var(--line) }
.split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px }
.map-box { padding: 12px; overflow: hidden }
.map-box svg { display: block; width: 100%; height: auto }
.places { display: flex; flex-direction: column }
.place { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 12px 4px; border-top: 1px solid var(--line) }
.place b { font-weight: 600; flex: 1 1 120px }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink2) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.news { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 16px }
.news .thumb { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 10px; display: flex; align-items: flex-end; padding: 8px; font-size: 12px; font-weight: 600; color: #FFFFFF }
.news h3 { font-size: 17px; line-height: 25px; font-weight: 600 }
.news p { font-size: 14px; color: var(--ink2) }
.news-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 4px }
.news-foot a { font-size: 14px }
.news-acts { display: flex; gap: 8px; margin-left: auto }
.comment { padding-left: 10px; border-left: 2px solid var(--news); font-size: 14px; color: var(--ink) }

/* 记录 */
.mods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
@media (max-width: 760px) { .mods { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 460px) { .mods { grid-template-columns: 1fr } }
.mod { display: flex; flex-direction: column; gap: 6px; padding: 16px; color: var(--ink); font-weight: 400 }
.mod:hover { text-decoration: none; box-shadow: 0 0 0 1px var(--muted) }
.raw { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 4px 16px; padding: 14px 4px; border-top: 1px solid var(--line) }
.raw time { font-size: 13px; color: var(--muted) }
.raw blockquote { margin: 0; font-size: 15px }
.raw .st { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2) }

/* 问问开图对话框 */
.scrim { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--scrim) }
.dialog { width: 100%; max-width: 560px; max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 18px; padding: 28px; border-radius: 20px; background: var(--surface); box-shadow: 0 20px 60px rgba(0,0,0,0.25) }
.dialog h2 { font-size: 22px; line-height: 30px; font-weight: 600 }
.steps { font-size: 13px; color: var(--muted) }
.choice { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 14px; border: 1.5px solid var(--line); background: transparent; text-align: left; width: 100% }
.choice[aria-pressed="true"] { border-color: var(--primary); background: var(--ask) }
.choice .radio { width: 20px; height: 20px; flex: none; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--muted) }
.choice[aria-pressed="true"] .radio { border: 6px solid var(--primary) }
.choice b { display: block; font-size: 16px; font-weight: 600 }
.choice span { font-size: 14px; color: var(--ink2) }
.toggle { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--line) }
.toggle input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--primary); flex: none }
.toggle label b { display: block; font-weight: 600 }
.toggle label span { font-size: 14px; color: var(--ink2) }
.dialog-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px }
.note { font-size: 13px; color: var(--muted) }

  var OB_GOALS = [

  var OB_NEEDS = { me: ['mail'], projects: ['projects'], health: ['health'], finance: ['finance', 'mail'], calendar: ['calendar'], explore: [], news: ['news'] };
  function obParse(text) {

    return '<div class="head"><h1>日程</h1><span class="sub">合并了你订阅的日历和开图的建议 · 15 分钟前刷新</span></div>' +
      '<div class="cal-bar"><div class="cal-nav"><button type="button" data-cal="prev" aria-label="上一段">‹</button><button type="button" data-cal="today">今天</button><button type="button" data-cal="next" aria-label="下一段">›</button></div>' +
      '<span class="cal-title" id="cal-title"></span><div class="seg" role="group" aria-label="视图">' + views.map(function (v) { return '<button type="button" data-calview="' + v[0] + '" aria-pressed="' + (cur === v[0]) + '">' + v[1] + '</button>'; }).join('') + '</div>' +
      '<button type="button" class="btn btn-quiet" data-cal="add">添加日历</button></div>' + form +
      '<div class="card cal"><div id="cal"></div></div>' +
      '<div class="cal-legend">' + subs + '<span><span class="dot" style="background:var(--health)"></span>健康 · 你记录的训练</span><span><span class="dot" style="background:var(--surface);box-shadow:0 0 0 1.5px var(--news)"></span>虚线 = 开图的建议，等你确认</span></div>' +
      '<div id="cal-detail" aria-live="polite"></div>';
  }
  function calDetail() {
    var box = document.getElementById('cal-detail'); if (!box) return;
    var e = events.filter(function (x) { return x.id === state.calEvent; })[0];
    if (!e) { box.innerHTML = '<p class="note">点一个日程看详情。</p>'; return; }
    var when = e.allDay ? e.start.slice(5).replace('-', ' 月 ') + ' 日 · 全天' : e.start.slice(5, 10).replace('-', ' 月 ') + ' 日 ' + hm(e.start) + '–' + hm(e.end);
    var st = state.sugg[e.id];
    var acts = e.suggest ? (st ? plain(st === 'yes' ? '已放进日程' : '已忽略', 'var(--control)', 'var(--ink2)') :
      '<div style="display:flex;gap:8px"><button type="button" class="btn btn-quiet" data-sugg="' + e.id + '" data-to="no">不用</button><button type="button" class="btn btn-primary" data-sugg="' + e.id + '" data-to="yes">放进日程</button></div>') : '';
    box.innerHTML = '<div class="card cal-detail"><span class="stack"><b style="font-size:16px;font-weight:600">' + e.title + '</b><span class="small">' + when + ' · ' + e.src + '</span></span>' + acts + '</div>';
  }
  function initCalendar() {
    if (calInst) { calInst.destroy(); calInst = null; }
    var el = document.getElementById('cal'); if (!el) return;
    if (!window.FullCalendar) { el.innerHTML = '<p class="cal-fallback">日程组件没有加载出来，检查一下网络后刷新。</p>'; return; }
    var cur = state.calView || (window.innerWidth < 760 ? 'timeGridDay' : 'timeGridWeek');
    calInst = new FullCalendar.Calendar(el, {
      locale: { code: 'zh-cn', week: { dow: 1, doy: 4 }, allDayText: '全天', noEventsText: '这段时间没有日程' },
      initialView: cur, initialDate: '2026-10-16', headerToolbar: false, height: 'auto',
      slotMinTime: '06:00:00', slotMaxTime: '23:00:00', scrollTime: '07:00:00',
      slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
      eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
      dayHeaderContent: function (arg) {
        if (arg.view.type.indexOf('timeGrid') !== 0) return '周' + '日一二三四五六'[arg.date.getDay()];
        return { html: '<span class="fc-dh"><span>周' + '日一二三四五六'[arg.date.getDay()] + '</span><b>' + arg.date.getDate() + '</b></span>' };
      },
      events: events.filter(function (e) { return state.sugg[e.id] !== 'no'; }).map(function (e) {
        return { id: e.id, title: e.title, start: e.start, end: e.end, allDay: !!e.allDay, classNames: [state.sugg[e.id] === 'yes' ? 'ev-health' : e.kind] };
      }),
      datesSet: function (info) { var t = document.getElementById('cal-title'); if (t) t.textContent = info.view.title; },
      eventClick: function (info) { state.calEvent = info.event.id; calDetail(); }
    });
    calInst.render();
    calDetail();
  }

  function paintAvatar() {
    document.querySelectorAll('#avatar, .menu-head .avatar').forEach(function (el) {
      el.classList.toggle('has-img', !!state.avatar);
      el.style.backgroundImage = state.avatar ? 'url(' + state.avatar + ')' : '';
    });
  }
  var crop = { img: null, x: 0, y: 0, base: 1, zoom: 1, V: 240 };
  var cropDlg = document.getElementById('crop-dialog'), cropImg = document.getElementById('crop-img'), cropZoom = document.getElementById('crop-zoom'), cropView = document.getElementById('crop-view');
  function cropClamp() {
    var sc = crop.base * crop.zoom, w = crop.img.naturalWidth * sc, h = crop.img.naturalHeight * sc;
    crop.x = Math.min(0, Math.max(crop.V - w, crop.x)); crop.y = Math.min(0, Math.max(crop.V - h, crop.y));
    cropImg.style.width = crop.img.naturalWidth + 'px';
    cropImg.style.transform = 'translate(' + crop.x + 'px,' + crop.y + 'px) scale(' + sc + ')';
  }
  function openCrop(file) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return;
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        crop.img = img; crop.V = cropView.clientWidth || 240; crop.zoom = 1; cropZoom.value = '1';
        crop.base = crop.V / Math.min(img.naturalWidth, img.naturalHeight);
        crop.x = (crop.V - img.naturalWidth * crop.base) / 2; crop.y = (crop.V - img.naturalHeight * crop.base) / 2;
        cropImg.src = img.src; cropDlg.hidden = false; cropClamp(); cropZoom.focus();
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }
  document.getElementById('avatar-file').addEventListener('change', function (e) { var f = e.target.files[0]; e.target.value = ''; if (f) openCrop(f); });
  cropZoom.addEventListener('input', function () {
    var old = crop.base * crop.zoom, cx = (crop.V / 2 - crop.x) / old, cy = (crop.V / 2 - crop.y) / old;
    crop.zoom = Number(cropZoom.value); var sc = crop.base * crop.zoom;
    crop.x = crop.V / 2 - cx * sc; crop.y = crop.V / 2 - cy * sc; cropClamp();
  });
  var drag = null;
  cropView.addEventListener('pointerdown', function (e) { drag = { x: e.clientX - crop.x, y: e.clientY - crop.y }; cropView.setPointerCapture(e.pointerId); });
  cropView.addEventListener('pointermove', function (e) { if (!drag) return; crop.x = e.clientX - drag.x; crop.y = e.clientY - drag.y; cropClamp(); });
  cropView.addEventListener('pointerup', function () { drag = null; });
  function closeCrop() { cropDlg.hidden = true; }
  document.getElementById('crop-cancel').addEventListener('click', closeCrop);
  cropDlg.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeCrop(); });
  document.getElementById('crop-save').addEventListener('click', function () {
    var sc = crop.base * crop.zoom, c = document.createElement('canvas'); c.width = c.height = 256;
    var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 256, 256);
    g.drawImage(crop.img, -crop.x / sc, -crop.y / sc, crop.V / sc, crop.V / sc, 0, 0, 256, 256);
    state.avatar = c.toDataURL('image/jpeg', 0.85); closeCrop(); paintAvatar(); render();
  });

  var view = document.getElementById('view');
  var mapDrag = null, mapPts = {};
  view.addEventListener('wheel', function (e) {
    var svg = e.target.closest('.map-svg'); if (!svg) return;
    e.preventDefault();
    var r = svg.getBoundingClientRect();
    zoomAt(Math.exp(e.deltaY * 0.0015), (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); redrawMap();
  }, { passive: false });
  view.addEventListener('pointerdown', function (e) {
    var svg = e.target.closest('.map-svg'); if (!svg) return;
    mapPts[e.pointerId] = { x: e.clientX, y: e.clientY };
    state.mapView = state.mapView || fitView(places.filter(placeVisible));
    mapDrag = { x: e.clientX, y: e.clientY, v: Object.assign({}, state.mapView), moved: false, dist: null };
  });
  view.addEventListener('pointermove', function (e) {
    if (!mapDrag || !mapPts[e.pointerId]) return;
    mapPts[e.pointerId] = { x: e.clientX, y: e.clientY };
    var b = mapBox(), ids = Object.keys(mapPts);
    if (ids.length === 2) {
      var p = mapPts[ids[0]], q = mapPts[ids[1]], d = Math.hypot(p.x - q.x, p.y - q.y);
      if (mapDrag.dist) { var r = document.querySelector('.map-svg').getBoundingClientRect(); zoomAt(mapDrag.dist / d, ((p.x + q.x) / 2 - r.left) / r.width, ((p.y + q.y) / 2 - r.top) / r.height); }
      mapDrag.dist = d; mapDrag.moved = true; return redrawMap();
    }
    var dx = e.clientX - mapDrag.x, dy = e.clientY - mapDrag.y;
    if (!mapDrag.moved && Math.hypot(dx, dy) < 4) return;
    mapDrag.moved = true;
    var k = mapDrag.v.w / b.w;
    state.mapView = clampView({ x: mapDrag.v.x - dx * k, y: mapDrag.v.y - dy * k, w: mapDrag.v.w });
    redrawMap(); var s2 = document.querySelector('.map-svg'); if (s2) s2.classList.add('is-dragging');
  });
  function endMapPointer(e) {
    delete mapPts[e.pointerId];
    if (mapDrag && !mapDrag.moved) mapDrag = null;
    var s2 = document.querySelector('.map-svg'); if (s2) s2.classList.remove('is-dragging');
  }
  view.addEventListener('pointerup', endMapPointer);
  view.addEventListener('pointercancel', endMapPointer);
  window.addEventListener('resize', function () { if (state.view === 'explore' && state.sub === 'places') redrawMap(); });
  function render() {
    view.dataset.view = state.view;
    view.innerHTML = state.view === 'calendar' ? calendarView() : state.view === 'me' ? me() : state.view === 'ask' ? ask() : state.view === 'explore' ? explore() : state.view === 'records' ? records() : overview();
    var box = document.getElementById('msgs'); if (box) box.scrollTop = box.scrollHeight;
    if (state.view === 'calendar') initCalendar(); else if (calInst) { calInst.destroy(); calInst = null; }
    document.querySelectorAll('.tabs button').forEach(function (b) {
      if (b.dataset.view === (state.view === 'calendar' ? 'records' : state.view)) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    document.getElementById('demo-data').setAttribute('aria-pressed', String(!state.first));
    document.getElementById('demo-first').setAttribute('aria-pressed', String(state.first));
    try { localStorage.setItem('kaitu-proto-view', state.view); } catch (e) {}
  }
  function go(v) { state.view = v; render(); window.scrollTo(0, 0); if (v === 'ask' && !state.connected) openAi(); }

  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-view]'); if (b) { if (b.dataset.view === 'records') state.rec = ''; go(b.dataset.view); }
  });
  document.getElementById('demo-data').addEventListener('click', function () { state.first = false; state.saved = ''; go('overview'); });
  document.getElementById('demo-first').addEventListener('click', function () { state.first = true; state.saved = ''; state.ob = 0; state.obPreview = false; go('overview'); });

  view.addEventListener('click', function (e) {
    var ob = e.target.closest('[data-ob],[data-obai],[data-obgoal],[data-obsrc],[data-obaipick]');
    if (ob) {
      var top = function () { render(); window.scrollTo(0, 0); };
      if (ob.dataset.obai) { state.obAi = ob.dataset.obai; return render(); }
      if (ob.dataset.obgoal) { state.obGoals = state.obGoals || {}; state.obGoals[ob.dataset.obgoal] = !state.obGoals[ob.dataset.obgoal]; return render(); }
      if (ob.dataset.obsrc) { state.obDone = state.obDone || {}; state.obDone[ob.dataset.obsrc] = true; return render(); }
      if (ob.dataset.obaipick) { state.obAiPick = ob.dataset.obaipick; return render(); }
      var act = ob.dataset.ob;
      if (act === 'copy') {
        var done = function () { state.obCopied = true; render(); };
        try { navigator.clipboard.writeText(OB_PROMPT).then(done, function () { var r = document.createRange(); r.selectNodeContents(document.getElementById('ob-prompt')); getSelection().removeAllRanges(); getSelection().addRange(r); }); } catch (x) { done(); }
        return;
      }
      if (act === 'sample') { state.obText = OB_SAMPLE; return render(); }
      if (act === 'start') { state.ob = 1; return top(); }
      if (act === 'later') { state.ob = 'done'; return top(); }
      if (act === 'restart') { state.ob = 1; state.obPreview = false; return top(); }
      if (act === 'goto') { state.ob = +ob.dataset.obto; return top(); }
      if (act === 'preview') { if (!(state.obText || '').trim()) { var ta = document.getElementById('ob-text'); if (ta) ta.focus(); return; } state.obPreview = true; state.obPick = {}; return top(); }
      if (act === 'save') { state.obSaved = obParse(state.obText).filter(function (it) { return state.obPick[it.i] !== false; }).length; state.obPreview = false; state.ob = 2; return top(); }
      if (act === 'back') { if (state.ob === 1 && state.obPreview) state.obPreview = false; else state.ob = Math.max(1, state.ob - 1); return top(); }
      if (act === 'skip') { state.ob = state.ob === 2 ? 'done' : state.ob + 1; return top(); }
      if (act === 'next') { state.ob += 1; return top(); }
      if (act === 'finish') { var pick = state.obAiPick || 'builtin'; state.ob = 'done'; top(); if (pick !== 'none') openAi(); return; }
    }
    var rc = e.target.closest('[data-rec],[data-fin],[data-src]');
    if (rc) {
      if (rc.matches('a')) e.preventDefault();
      if (rc.hasAttribute('data-rec')) { if (rc.dataset.rec === 'calendar') return go('calendar'); state.rec = rc.dataset.rec; state.view = 'records'; render(); window.scrollTo(0, 0); return; }
      if (rc.dataset.fin) { state.fin = rc.dataset.fin; return render(); }
      state.src = rc.dataset.src; return render();
    }
    var av = e.target.closest('[data-avatar]');
    if (av) { if (av.dataset.avatar === 'pick') document.getElementById('avatar-file').click(); else { state.avatar = null; paintAvatar(); render(); } return; }
    var k = e.target.closest('[data-cal],[data-calview],[data-sugg]');
    if (k) {
      if (k.dataset.calview) { state.calView = k.dataset.calview; return render(); }
      if (k.dataset.sugg) { state.sugg[k.dataset.sugg] = k.dataset.to; return render(); }
      var a = k.dataset.cal;
      if (a === 'add') { state.addCal = !state.addCal; render(); var u = document.getElementById('cal-url'); if (u) u.focus(); return; }
      if (a === 'cancel') { state.addCal = false; return render(); }
      if (calInst) calInst[a]();
      return;
    }
    var m = e.target.closest('[data-me],[data-fact]');
    if (m) {
      if (m.dataset.me) { state.me = m.dataset.me; return render(); }
      state.facts[m.dataset.fact] = m.dataset.to; return render();
    }
    var zb = e.target.closest('[data-zoom]');
    if (zb) { var zk = zb.dataset.zoom; if (zk === 'in') zoomAt(0.6); else if (zk === 'out') zoomAt(1 / 0.6); else if (zk === 'world') state.mapView = worldView(); else state.mapView = null; return redrawMap(); }
    if (mapDrag && mapDrag.moved) { mapDrag = null; return; }
    var ct = e.target.closest('[data-city],[data-layer]');
    if (ct) { if (ct.dataset.layer) { state.layers = Object.assign({ been: true, now: true, plan: true }, state.layers); state.layers[ct.dataset.layer] = !state.layers[ct.dataset.layer]; } else { var ci = +ct.dataset.city; state.city = state.city === ci ? null : ci; } return render(); }
    var hb = e.target.closest('[data-hint]');
    if (hb) { state.hints = state.hints || {}; state.hints[hb.dataset.hint] = !state.hints[hb.dataset.hint]; return render(); }
    var nw = e.target.closest('[data-news]');
    if (nw) { if (nw.matches('a')) e.preventDefault(); state.newsFb = state.newsFb || {}; state.newsFb[nw.dataset.news] = nw.dataset.fb; return render(); }
    var md = e.target.closest('[data-mode]');
    if (md) {
      var a2 = md.dataset.mode; state.fullMode = state.fullMode || {};
      if (a2 === 'toggle') { state.modeOpen = !state.modeOpen; state.modeConfirm = false; }
      else if (a2 === 'safe') { state.fullMode[state.thread] = false; state.modeOpen = false; }
      else if (a2 === 'ask-full') { if (state.fullMode[state.thread]) state.modeOpen = false; else state.modeConfirm = true; }
      else if (a2 === 'full') { state.fullMode[state.thread] = true; state.modeOpen = false; state.modeConfirm = false; }
      else { state.modeConfirm = false; }
      return render();
    }
    var c = e.target.closest('[data-thread],[data-new],[data-suggest],[data-act]');
    if (c) {
      if (c.dataset.thread) { state.thread = c.dataset.thread; state.modeOpen = false; return render(); }
      if (c.hasAttribute('data-new')) { threads.fresh = { title: '新对话', day: '今天', msgs: [] }; state.thread = 'fresh'; render(); var i = document.getElementById('chat-input'); if (i) i.focus(); return; }
      if (c.dataset.suggest) return send(c.dataset.suggest);
      if (c.dataset.act) return send(c.dataset.act);
    }
    var t = e.target.closest('[data-go],[data-done],#focus-done,[data-ask],[data-dir],[data-sub],[data-open-ai]');
    if (!t) return;
    if (t.matches('a')) e.preventDefault();
    if (t.dataset.go) return go(t.dataset.go);
    if (t.dataset.done) { state.done[t.dataset.done] = !state.done[t.dataset.done]; return render(); }
    if (t.id === 'focus-done') { state.focusDone = !state.focusDone; return render(); }
    if (t.hasAttribute('data-ask')) { state.asked = true; return render(); }
    if (t.dataset.dir) { state.dirs[t.dataset.dir] = t.dataset.to; return render(); }
    if (t.dataset.sub) { state.sub = t.dataset.sub; return render(); }
    if (t.hasAttribute('data-open-ai')) return openAi();
  });
  view.addEventListener('submit', function (e) {
    if (e.target.id === 'cal-form') { e.preventDefault(); var n = document.getElementById('cal-name').value.trim() || '新日历'; state.cals.push([n, '订阅 · 正在第一次同步', 'ev-work']); state.addCal = false; return render(); }
    if (e.target.id === 'chat-form') { e.preventDefault(); return send(document.getElementById('chat-input').value); }
    if (e.target.id !== 'capture') return;
    e.preventDefault();
    var v = document.getElementById('capture-text').value.trim();
    if (v) { state.saved = v; render(); }
  });

  var dlg = document.getElementById('ai-dialog');
  var s1 = document.getElementById('ai-step1'), s2 = document.getElementById('ai-step2');
  var lastFocus = null;
  function openAi() {
    lastFocus = document.activeElement;
    s1.hidden = false; s2.hidden = true; dlg.hidden = false;
    dlg.querySelector('.choice').focus();
  }
  function closeAi() { dlg.hidden = true; if (lastFocus) lastFocus.focus(); }
  document.getElementById('demo-ai').addEventListener('click', function () { state.connected = false; go('ask'); });
  document.getElementById('ai-next').addEventListener('click', function () { s1.hidden = true; s2.hidden = false; document.getElementById('auto-morning').focus(); });
  view.addEventListener('input', function (e) { if (e.target.id === 'ob-text') { state.obText = e.target.value; return; } if (e.target.dataset && e.target.dataset.obpick) { state.obPick[e.target.dataset.obpick] = e.target.checked; var sv = view.querySelector('[data-ob="save"]'); if (sv) sv.textContent = '记下这 ' + obParse(state.obText).filter(function (it) { return state.obPick[it.i] !== false; }).length + ' 条'; return; } if (e.target.id === 'map-year') { state.mapYear = +e.target.value; render(); var r = document.getElementById('map-year'); if (r) r.focus(); } });
  view.addEventListener('change', function (e) {
    if (e.target.dataset && e.target.dataset.auto) { state.auto[e.target.dataset.auto] = e.target.checked; render(); var sw = document.getElementById(e.target.id); if (sw) sw.focus(); }
    if (e.target.dataset && e.target.dataset.time && e.target.value) state.times[e.target.dataset.time] = e.target.value;
  });
  var avatar = document.getElementById('avatar'), menu = document.getElementById('me-menu');
  function setMenu(open) { menu.hidden = !open; avatar.setAttribute('aria-expanded', String(open)); if (open) menu.querySelector('[role="menuitem"]').focus(); }
  avatar.addEventListener('click', function (e) { e.stopPropagation(); setMenu(menu.hidden); });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('[data-me]'); if (!b) return;
    state.me = b.dataset.me; setMenu(false); go('me');
  });
  menu.addEventListener('keydown', function (e) { if (e.key === 'Escape') { setMenu(false); avatar.focus(); } });
  document.addEventListener('click', function (e) { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
  view.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.city')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
    if (e.target.id !== 'chat-input' || e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
    e.preventDefault(); send(e.target.value);
  });
  dlg.addEventListener('click', function (e) {
    if (e.target.closest('[data-finish]')) { state.connected = true; if (state.view === 'ask') render(); }
    if (e.target === dlg || e.target.closest('[data-close]')) return closeAi();
    var c = e.target.closest('.choice');
    if (c) dlg.querySelectorAll('.choice').forEach(function (x) { x.setAttribute('aria-pressed', String(x === c)); });
  });
  dlg.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAi(); });

  render();
})();
</script>
