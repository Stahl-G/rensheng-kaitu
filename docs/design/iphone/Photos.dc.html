<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>开图 · 从照片找城市</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;margin:0;cursor:pointer}
a{color:#2B4C7E;text-decoration:none}a:hover{color:#1B3254}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5F5F3; color: #1F1E1D; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 420px; background: #F4F6F7;">
    <svg width="390" height="420" viewBox="0 0 390 420" style="display: block;">
      <path d="M0 120 C60 100 120 140 170 120 S260 70 320 96 S380 140 390 130 L390 420 L0 420 Z" fill="#EEF1EC"></path>
      <path d="M40 0 V420 M120 0 V420 M200 0 V420 M280 0 V420 M360 0 V420 M0 80 H390 M0 160 H390 M0 240 H390 M0 320 H390" stroke="#DDE2DA" stroke-width="1"></path>
      <path d="M118 262 C150 240 190 236 226 214" stroke="#B8CBE4" stroke-width="22" stroke-opacity="0.55" fill="none" stroke-linecap="round"></path>
      <path d="M118 262 C150 240 190 236 226 214" stroke="#1B3254" stroke-width="3" fill="none" stroke-linecap="round"></path>
      <circle cx="118" cy="262" r="5" fill="#1B3254"></circle>
      <circle cx="226" cy="214" r="6" fill="#1B3254"></circle>
      <text x="236" y="210" font-size="15" font-weight="700" fill="#1B3254">上海</text>
      <text x="80" y="284" font-size="13" fill="#4D4C48">合肥</text>
    </svg>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 56px; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-size: 34px; line-height: 41px; font-weight: 700;">开图</span>
    <span style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.72); box-shadow: 0 0 0 1px rgba(230,228,221,0.9); font-size: 13px; color: #4D4C48;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #3E8A5A;"></span>电脑 07:30 更新</span>
  </div>

  <section style="position: absolute; left: 0; right: 0; bottom: 0; top: 404px; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 32px; border-radius: 24px 24px 0 0; background: rgba(255,255,255,0.86); box-shadow: 0 -1px 0 #E6E4DD;">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; margin-top: -8px; border-radius: 3px; background: #D9D8D3;"></div>

    <sc-if value="{{entry}}">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #6B6A66;">走过的城市 · 2</span>
        <button type="button" onclick="{{start}}" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 0; border-radius: 18px; background: #EEF2F7; box-shadow: 0 0 0 1px #D3DEEC; text-align: left;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B3254" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M4 17l5-5 4 4 3-3 4 4"></path></svg>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 17px; line-height: 22px; font-weight: 600; color: #1B3254;">从照片找出你去过的城市</span>
            <span style="font-size: 13px; line-height: 18px; color: #4D4C48;">只读拍摄时间和地点，不读照片内容</span>
          </span>
          <svg width="8" height="14" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6" stroke="#2B4C7E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #6B6A66;">接下来往哪走</span>
        <span style="font-size: 17px; line-height: 22px;">年底出一本摄影集</span>
        <span style="font-size: 15px; color: #4D4C48;">把初选从 80 张挑到 30 张</span>
      </div>
    </sc-if>

    <sc-if value="{{scanning}}">
      <div onclick="{{finish}}" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1px #E6E4DD;">
        <span style="font-size: 17px; line-height: 22px; font-weight: 600;">正在看照片…</span>
        <div style="height: 6px; border-radius: 3px; background: #F0EFEC; overflow: hidden;"><div style="width: 40%; height: 6px; border-radius: 3px; background: #1B3254;"></div></div>
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #6B6A66; font-variant-numeric: tabular-nums;">
          <span>12,400 / 31,000 张</span><span>已找到 14 个城市</span>
        </div>
        <button type="button" onclick="{{reset}}" style="align-self: flex-start; height: 36px; padding: 0 16px; border-radius: 18px; border: 0; background: #F0EFEC; font-size: 15px;">取消</button>
      </div>
      <span style="font-size: 13px; line-height: 18px; color: #6B6A66;">可以离开这一页，看完会告诉你。</span>
    </sc-if>

    <sc-if value="{{done}}">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 22px; line-height: 29px; font-weight: 600;">找到 23 个城市、41 段经历</span>
        <span style="font-size: 15px; line-height: 21px; color: #4D4C48;">已交给电脑，在开图的地图里核对后才会显示。</span>
      </div>
      <div style="border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1px #E6E4DD; overflow: hidden;">
        <div style="display: flex; justify-content: space-between; padding: 12px 16px; font-size: 15px;"><span>上海 · 住过</span><span style="color: #6B6A66; font-variant-numeric: tabular-nums;">2018-09 至今</span></div>
        <div style="height: 1px; background: #E6E4DD; margin-left: 16px;"></div>
        <div style="display: flex; justify-content: space-between; padding: 12px 16px; font-size: 15px;"><span>京都 · 去过</span><span style="color: #6B6A66; font-variant-numeric: tabular-nums;">2019-05-02 – 05-06</span></div>
        <div style="height: 1px; background: #E6E4DD; margin-left: 16px;"></div>
        <div style="display: flex; justify-content: space-between; padding: 12px 16px; font-size: 15px;"><span>南京 · 住过</span><span style="color: #6B6A66; font-variant-numeric: tabular-nums;">2014-09 – 2018-06</span></div>
        <div style="height: 1px; background: #E6E4DD; margin-left: 16px;"></div>
        <div style="padding: 12px 16px; font-size: 15px; color: #6B6A66;">还有 38 段</div>
      </div>
      <button type="button" onclick="{{reset}}" style="height: 50px; border: 0; border-radius: 25px; background: #1F1E1D; color: #FFFFFF; font-size: 17px; font-weight: 600;">好</button>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 0 }; }
  renderVals() {
    const s = this.state.step;
    return {
      entry: s === 0, scanning: s === 1, done: s === 2,
      start: () => this.setState({ step: 1 }),
      finish: () => this.setState({ step: 2 }),
      reset: () => this.setState({ step: 0 }),
    };
  }
}
</script>
</body>
</html>
