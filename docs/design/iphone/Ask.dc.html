<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>开图 · 问问</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
button,input{font:inherit;color:inherit;margin:0}
button{cursor:pointer}
a{color:#2B4C7E;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5F5F3; color: #1F1E1D; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 56px 20px 0;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 15px; font-weight: 500; color: #6B6A66;">DeepSeek · 你的 Key</span>
      <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700;">问问</h1>
    </div>
    <button type="button" aria-label="新对话" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #E6E4DD; color: #4D4C48; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h8"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 180px;">
    <div style="align-self: flex-end; max-width: 78%; padding: 10px 14px; border-radius: 18px 18px 6px 18px; background: #1F1E1D; color: #FFFFFF; font-size: 17px; line-height: 23px;">这周训练够了吗？</div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1px #E6E4DD;">
      <p style="margin: 0; font-size: 17px; line-height: 25px;">这周练了 3 次，比你定的 4 次少一次。平均睡眠 6.8 小时，周四之后偏少。周六的有氧还没做。</p>
      <div style="display: flex; flex-wrap: wrap; gap: 6px;">
        <span style="padding: 3px 10px; border-radius: 8px; background: #F0EFEC; color: #4D4C48; font-size: 13px;">训练记录 · 本周</span>
        <span style="padding: 3px 10px; border-radius: 8px; background: #F0EFEC; color: #4D4C48; font-size: 13px;">睡眠 · 本周</span>
        <span style="padding: 3px 10px; border-radius: 8px; background: #F0EFEC; color: #4D4C48; font-size: 13px;">健康规则</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 18px; background: #EEF2F7; box-shadow: 0 0 0 1px #D3DEEC;">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #1B3254;">建议</span>
      <span style="font-size: 17px; line-height: 23px; font-weight: 600;">明天 18:30 有氧 30 分钟</span>
      <sc-if value="{{pending}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; gap: 8px;">
          <button type="button" onClick="{{keep}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #1F1E1D; color: #FFFFFF; font-size: 15px; font-weight: 600;">放进待确认</button>
          <button type="button" onClick="{{drop}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #FFFFFF; color: #1F1E1D; font-size: 15px; box-shadow: 0 0 0 1px #D3DEEC;">不用</button>
        </div>
      </sc-if>
      <sc-if value="{{kept}}" hint-placeholder-val="{{false}}">
        <span style="font-size: 13px; color: #4D4C48;">已放进待确认 · 等 Dot 处理</span>
      </sc-if>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 99px; display: flex; gap: 10px; align-items: center;">
    <label style="flex: 1; min-width: 0; display: flex; align-items: center; height: 52px; padding: 0 18px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(31,30,29,0.12), 0 0 0 1px #E6E4DD;">
      <input placeholder="问问开图…" aria-label="问问开图" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 17px;">
    </label>
    <button type="button" aria-label="按住说话" style="width: 52px; height: 52px; flex: none; border-radius: 26px; border: 0; background: #1F1E1D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(31,30,29,0.22);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
    </button>
  </div>
  <nav aria-label="页面" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; padding-top: 8px; background: #FCFCFB; border-top: 1px solid #E6E4DD; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6A66; font-size: 11px; font-weight: 500;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"></path></svg>
      今天
    </a>
    <a href="Map.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6A66; font-size: 11px; font-weight: 500;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>
      开图
    </a>
    <a href="Library.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6A66; font-size: 11px; font-weight: 500;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10l2 2.5h6.5A1.5 1.5 0 0 1 20 8v10.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"></path><path d="M8 13h8M8 16.5h5"></path></svg>
      资料
    </a>
    <a href="Ask.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #1B3254; font-size: 11px; font-weight: 600;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.7 7.1L4 20l1-4A8 8 0 1 1 20 12z"></path><path d="M9 11h.01M12 11h.01M15 11h.01"></path></svg>
      问问
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { s: 'pending' }; }
  renderVals() {
    return {
      pending: this.state.s === 'pending',
      kept: this.state.s === 'kept',
      keep: () => this.setState({ s: 'kept' }),
      drop: () => this.setState({ s: 'dropped' }),
    };
  }
}
</script>
</body>
</html>
